<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Positioning Task</title>
    <style>
        div {
            font-size: 14px;
        }


        .box-static {
            width: 80px;
            height: 80px;
            margin-bottom: 5px;
            background: khaki;
        }


        .box-relative-1 {
            position: relative;
            top: 15px;
            left: 15px;
            width: 100px;
            height: 100px;
            background: lightsalmon;
        }

        .box-relative-2 {
            position: relative;
            top: -15px;
            left: 20px;
            width: 120px;
            height: 120px;
            background: plum;
        }

        .container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-top: 25px;
            background: beige;
        }

        .box-absolute-1 {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 3;
            width: 100px;
            height: 100px;
            background: mediumaquamarine;
        }

        .box-absolute-2 {
            position: absolute;
            top: 70px;
            left: 50px;
            z-index: 2;
            width: 120px;
            height: 120px;
            background: gold;
        }

        .box-absolute-3 {
            position: absolute;
            top: 120px;
            left: 80px;
            z-index: 1;
            width: 140px;
            height: 140px;
            background: slateblue;
        }

        .box-zindex-1 {
            position: absolute;
            top: 40px;
            left: 143px;
            z-index: 5;
            width: 150px;
            height: 150px;
            background: lightpink;
        }

        .box-zindex-2 {
            position: absolute;
            top: 92px;
            left: 174px;
            z-index: 4;
            width: 150px;
            height: 150px;
            background: cornflowerblue;
        }

        .box-fixed-1 {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 10;
            width: 80px;
            height: 80px;
            background: violet;
        }

        .box-fixed-2 {
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 10;
            width: 100px;
            height: 100px;
            background: turquoise;
        }
    </style>
</head>
<body>

    <div class="box-static">Static</div>
    <div class="box-static">Static</div>


    <div class="box-relative-1">Relative 1</div>
    <div class="box-relative-2">Relative 2</div>


    <div class="container">
        <div class="box-absolute-1">Absolute 1</div>
        <div class="box-absolute-2">Absolute 2</div>
        <div class="box-absolute-3">Absolute 3</div>
    </div>


    <div class="box-zindex-1">Z-Index 5</div>
    <div class="box-zindex-2">Z-Index 4</div>


    <div class="box-fixed-1">Fixed Top-Right</div>
    <div class="box-fixed-2">Fixed Bottom-Left</div>

</body>
</html>
